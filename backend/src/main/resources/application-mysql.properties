# MySQL is the default application profile. It may also be selected explicitly.
# Configure DB_USER and DB_PASSWORD in the run environment; do not commit credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/contributions?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:contrib_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

